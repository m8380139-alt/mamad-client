name: Run Gradle Build
on:
  - push
  - pull_request

# پیش‌فرض: فقط خواندن. دسترسی نوشتن فقط برای مرحلهٔ انتشار (job جدا) داده می‌شود.
permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4.1.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Gradle build
        run: ./gradlew build

      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4.3.0
        with:
          name: mod-jar
          path: build/libs/*.jar

  release:
    needs: gradle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: mod-jar
          path: build/libs

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp "$(ls build/libs/mamadclient-*.jar | head -1)" mamadclient.jar
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mamadclient.jar --target "$GITHUB_SHA" --title "Mamad Client (latest)" --notes "Auto-built from ${GITHUB_SHA::7}" --latest
